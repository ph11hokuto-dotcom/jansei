<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>雀聖への道</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="雀聖への道">
<meta name="theme-color" content="#174836">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --felt:#1f5b45; --felt2:#174836; --ink:#f3efe2; --sub:#bcd3c6;
  --tile:#fbf7ea; --tileEdge:#d9cfb2; --tileBack:#2e7d5b;
  --man:#b8222a; --pin:#1c4fa0; --sou:#1d7a3a; --hon:#222;
  --gold:#f2c14e; --ok:#7fd99a; --ng:#ff8a80; --panel:rgba(0,0,0,.22);
  --tw:min(calc((100vw - 40px) / 14.6), 46px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--felt2);color:var(--ink);
  font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;-webkit-tap-highlight-color:transparent}
body{overflow:hidden}
#app{height:100dvh;max-width:780px;margin:0 auto;display:flex;flex-direction:column;
  background:radial-gradient(ellipse at 50% 30%,#277055 0%,var(--felt) 55%,var(--felt2) 100%);padding:max(20px,calc(env(safe-area-inset-top) + 48px)) 16px calc(8px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:8px}
header h1{font-size:18px;margin:0;letter-spacing:.08em;white-space:nowrap}
header .rank{margin-left:auto;font-size:12px;color:var(--sub);text-align:right;line-height:1.3}
header .rank b{color:var(--gold);font-size:15px}
.btn{border:0;border-radius:10px;padding:9px 14px;font-size:15px;font-weight:700;cursor:pointer;
  background:var(--ink);color:#1b3d30;font-family:inherit}
.btn.small{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid rgba(255,255,255,.45)}
.btn.gold{background:var(--gold);color:#3a2a00}
.btn.red{background:#e2574c;color:#fff}
.btn.blue{background:#5b8fd9;color:#fff}
.btn:disabled{opacity:.45;cursor:default}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:8px 0 6px}
nav button{padding:7px 2px;border-radius:10px;border:0;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap;
  background:rgba(0,0,0,.2);color:var(--sub);font-family:inherit}
nav button.on{background:var(--ink);color:#1b3d30}
#sub{display:flex;gap:6px;align-items:center;min-height:30px;font-size:13px;color:var(--sub);flex-wrap:wrap}
#sub .sp{margin-left:auto}
.chip{border:1.5px solid rgba(255,255,255,.35);background:transparent;color:var(--ink);border-radius:999px;
  padding:3px 10px;font-size:12px;cursor:pointer;font-family:inherit}
.chip.on{background:var(--gold);color:#3a2a00;border-color:var(--gold);font-weight:700}
main{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding-top:4px}
.q{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.q small{font-weight:400;color:var(--sub);font-size:12px}
.timer{margin-left:auto;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.bar{height:4px;background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);width:100%;transition:width .2s linear}
.hand{display:flex;justify-content:center;flex-wrap:nowrap;gap:1px;padding:6px 0}
.tile{width:var(--tw);height:calc(var(--tw)*1.38);background:linear-gradient(180deg,#fffdf4,var(--tile));
  border-radius:calc(var(--tw)*.14);box-shadow:0 calc(var(--tw)*.1) 0 var(--tileEdge),0 calc(var(--tw)*.13) 0 #9b8f6d,0 4px 8px rgba(0,0,0,.35);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;position:relative;
  font-family:"Yu Mincho","Hiragino Mincho ProN","MS Mincho",serif;font-weight:700;user-select:none;flex:none;transition:transform .12s;color:#1a1a1a}
.tile .face{display:flex;flex-direction:column;align-items:center;justify-content:center;width:86%;height:88%;flex:none}
.tile .face svg{width:100%;height:100%;display:block}
.tile .n{font-size:calc(var(--tw)*.56);line-height:1}
.tile .s{font-size:calc(var(--tw)*.5);line-height:1;margin-top:calc(var(--tw)*.04)}
.tile.m .n{color:#1a1a1a}.tile.m .s{color:var(--man)}
.tile.h .n{font-size:calc(var(--tw)*.74)}
.tile.h.w .face{width:62%;height:66%;border:calc(var(--tw)*.05) solid #4a7fd0;border-radius:calc(var(--tw)*.06)}
.tile.h.g .n{color:var(--sou)}.tile.h.r .n{color:var(--man)}
.tile.click{cursor:pointer}
.tile.sel{transform:translateY(-10px);outline:3px solid var(--gold);outline-offset:1px}
.tile.mark{outline:3px solid var(--gold);outline-offset:1px}
.tile.dim{opacity:.45}
.tile.sideways{width:calc(var(--tw)*1.38);height:var(--tw);align-self:end}
.tile.sideways .face{width:calc(var(--tw)*.86);height:calc(var(--tw)*1.2);transform:rotate(90deg)}
.result .tile{display:inline-flex;vertical-align:middle}
.tile.mini{--tw:min(calc((100vw - 40px) / 22), 28px)}
.tile.mini2{--tw:min(calc((100vw - 60px) / 11), 34px)}
.gap{width:calc(var(--tw)*.35)}
.picker{display:flex;flex-direction:column;gap:6px;align-items:center}
.picker .row{display:flex;gap:3px;flex-wrap:nowrap}
.picker .tile{--tw:min(calc((100vw - 60px) / 9.8), 40px);cursor:pointer;opacity:.6}
.picker .tile.on{opacity:1;transform:translateY(-6px);outline:3px solid var(--gold)}
.picker .tile.right{opacity:1;outline:3px solid var(--ok)}
.picker .tile.wrong{opacity:1;outline:3px solid var(--ng)}
.picker .tile.miss{opacity:1;outline:3px dashed var(--ok)}
.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.result{flex:1;min-height:0;overflow:auto;background:var(--panel);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6}
.result:empty{display:none}
.verdict{font-size:20px;font-weight:800;margin-bottom:2px}
.verdict.ok{color:var(--ok)}.verdict.ng{color:var(--ng)}.verdict.mid{color:var(--gold)}
.jikkyo{color:var(--gold);font-weight:700;margin-bottom:6px}
.groups{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:3px 0 6px}
.grp{display:flex;gap:1px;padding:2px;border-radius:5px}
.grp.hit{background:rgba(242,193,78,.35)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
td,th{padding:3px 4px;border-bottom:1px solid rgba(255,255,255,.12);text-align:left;vertical-align:middle;white-space:nowrap}
th{color:var(--sub);font-weight:400}
tr.best td{color:var(--ok);font-weight:700}
.ukelist{display:flex;flex-wrap:wrap;gap:1px}
.rrow{display:flex;gap:1px;align-items:flex-end}
.river{display:flex;flex-direction:column;gap:3px;padding:4px;background:rgba(0,0,0,.15);border-radius:8px}
.river .tile{--tw:min(calc((100vw - 60px) / 12), 30px)}
.oppbox{display:flex;gap:10px;align-items:center;justify-content:center}
.opplabel{font-size:13px;line-height:1.5}
.opplabel b{color:#ffb3a7;font-size:15px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--panel);border-radius:12px;padding:10px 12px}
.card h3{margin:0 0 4px;font-size:14px}
.card .big{font-size:22px;font-weight:800;color:var(--gold)}
.note{font-size:11.5px;color:var(--sub)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:1px 10px}
.kv span:nth-child(odd){color:var(--sub)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111c;color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
.prog{height:8px;background:rgba(255,255,255,.15);border-radius:8px;overflow:hidden;margin:4px 0}
.prog i{display:block;height:100%;background:var(--gold)}
.sit{font-size:12.5px;line-height:1.5;background:var(--panel);border-radius:10px;padding:6px 10px}
.sit b{color:var(--gold)}
.choices{display:flex;flex-direction:column;gap:6px}
.choices .btn{width:100%;text-align:left;font-size:14px;padding:9px 12px;background:rgba(255,255,255,.92)}
.choices .btn:disabled{opacity:.55}
.choices .btn.right,.choices .btn.wrong{opacity:1}
.choices .btn.right{background:var(--ok);color:#0b3a1c}
.choices .btn.wrong{background:var(--ng);color:#4a0d08}
.melds{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.melds .grp{background:rgba(0,0,0,.18)}
.callin{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px}
.scores{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center;font-size:12.5px}
.scores div{background:var(--panel);border-radius:8px;padding:4px 2px;line-height:1.35}
.scores .me{outline:2px solid var(--gold)}
.scores b{font-size:15px;color:var(--ink)}
.small-river{display:flex;flex-wrap:wrap;gap:1px;justify-content:center}
.small-river .tile{--tw:min(calc((100vw - 60px) / 18), 22px)}
.stat .card .kv{font-size:12.5px}
@media (max-width:420px){header h1{font-size:16px} nav button{font-size:12.5px}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1><img src="icon.svg" alt="" width="26" height="26" style="border-radius:7px;vertical-align:-6px;margin-right:6px">雀聖への道</h1>
    <button class="btn small ghost" id="saveBtn">セーブ</button><span style="font-size:10px;color:var(--sub)">v6</span>
    <div class="rank" id="rank"></div>
  </header>
  <nav>
    <button data-m="wait">待ち当て</button>
    <button data-m="nani">何切る</button>
    <button data-m="oshi">押し引き</button>
    <button data-m="anzen">安全牌</button>
    <button data-m="hantei">判断</button>
    <button data-m="oras">オーラス</button>
    <button data-m="chishiki">知識</button>
    <button data-m="rec">記録</button>
  </nav>
  <div id="sub"></div>
  <main id="main"></main>
</div>
<div id="toast"></div>
<script>
"use strict";
/* ===== 牌の基本 ===== 0-8 萬子, 9-17 筒子, 18-26 索子, 27-33 東南西北白發中 */
const KAN=['一','二','三','四','五','六','七','八','九'];
const HON=['東','南','西','北','白','發','中'];
const SUITNAME=['萬','筒','索'];
const r=n=>Math.floor(Math.random()*n);
const pick=a=>a[r(a.length)];
const isHonor=t=>t>=27;
const suitOf=t=>Math.floor(t/9);
const numOf=t=>t%9+1;
const zeros=()=>new Array(34).fill(0);
const sum=c=>c.reduce((a,b)=>a+b,0);
function tileName(t){ if(isHonor(t)) return HON[t-27]; return numOf(t)+SUITNAME[suitOf(t)]; }
/* 牌の絵柄（SVG, 60x80） */
const CB='#1c4fa0',CG='#1d7a3a',CR='#c8202a';
function pc(x,y,r,col){return `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="${col}" stroke-width="${(r*.24).toFixed(2)}"/>`+
  `<circle cx="${x}" cy="${y}" r="${(r*.6).toFixed(2)}" fill="${col}"/><circle cx="${x}" cy="${y}" r="${(r*.3).toFixed(2)}" fill="#fff"/><circle cx="${x}" cy="${y}" r="${(r*.13).toFixed(2)}" fill="${col}"/>`;}
function st(x,y,h,col,rot=0){const w=8.4,q=h/2;
  return `<g transform="translate(${x} ${y}) rotate(${rot})"><rect x="${-w/2}" y="${-q}" width="${w}" height="${h}" rx="3" fill="${col}"/>`+
  `<rect x="${-w/2-0.6}" y="-1.1" width="${w+1.2}" height="2.2" rx="1" fill="${col}"/><line x1="0" y1="${-q+2.5}" x2="0" y2="-2.6" stroke="#fff" stroke-width="1.3" stroke-linecap="round" opacity=".75"/>`+
  `<line x1="0" y1="2.6" x2="0" y2="${q-2.5}" stroke="#fff" stroke-width="1.3" stroke-linecap="round" opacity=".75"/></g>`;}
const PIN={
 1:()=>{let d='';for(let k=0;k<12;k++){const a=k*Math.PI/6;d+=`<circle cx="${(30+19*Math.cos(a)).toFixed(1)}" cy="${(40+19*Math.sin(a)).toFixed(1)}" r="2.6" fill="${CG}"/>`;}
   return `<circle cx="30" cy="40" r="26" fill="#fff" stroke="${CB}" stroke-width="2.6"/>${d}<circle cx="30" cy="40" r="13" fill="${CR}"/><circle cx="30" cy="40" r="8" fill="#fff"/><circle cx="30" cy="40" r="4.5" fill="${CB}"/>`;},
 2:()=>pc(30,21,13,CG)+pc(30,59,13,CB),
 3:()=>pc(13,14,10,CB)+pc(30,40,10,CR)+pc(47,66,10,CG),
 4:()=>pc(16,21,11.5,CB)+pc(44,21,11.5,CG)+pc(16,59,11.5,CG)+pc(44,59,11.5,CB),
 5:()=>pc(14,15,10.5,CB)+pc(46,15,10.5,CG)+pc(30,40,10.5,CR)+pc(14,65,10.5,CG)+pc(46,65,10.5,CB),
 6:()=>pc(16,13,9.5,CG)+pc(44,13,9.5,CG)+pc(16,44,9.5,CR)+pc(44,44,9.5,CR)+pc(16,67,9.5,CR)+pc(44,67,9.5,CR),
 7:()=>pc(11,10,8.2,CG)+pc(30,18,8.2,CG)+pc(49,26,8.2,CG)+pc(17,48,8.6,CR)+pc(43,48,8.6,CR)+pc(17,68,8.6,CR)+pc(43,68,8.6,CR),
 8:()=>[11,30,49,68].map(y=>pc(17,y,9,CB)+pc(43,y,9,CB)).join(''),
 9:()=>[[14,CB],[40,CR],[66,CG]].map(([y,c])=>pc(11,y,8.6,c)+pc(30,y,8.6,c)+pc(49,y,8.6,c)).join('')
};
const SOU={
 1:()=>`<path d="M14 62 Q8 40 22 30" stroke="${CG}" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M18 66 Q20 46 30 38" stroke="${CB}" stroke-width="3" fill="none" stroke-linecap="round"/>`+
   `<path d="M24 68 Q32 52 36 42" stroke="${CG}" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="13" cy="63" r="3.2" fill="${CR}"/><circle cx="18" cy="67" r="3.2" fill="${CB}"/><circle cx="24" cy="69" r="3.2" fill="${CR}"/>`+
   `<ellipse cx="34" cy="36" rx="13" ry="10" fill="${CG}"/><circle cx="43" cy="22" r="7.5" fill="${CG}"/><path d="M42 15 l-2 -6 l4 4 l2 -6 l1 7" fill="${CR}"/>`+
   `<path d="M50 21 l7 2 l-7 2z" fill="#e0a020"/><circle cx="45" cy="21" r="1.6" fill="#fff"/><circle cx="45.3" cy="21" r=".8" fill="#111"/>`+
   `<path d="M28 36 q6 6 12 0" stroke="#fff" stroke-width="1.4" fill="none" opacity=".7"/><path d="M32 46 l-2 8 M37 46 l1 8" stroke="${CR}" stroke-width="2" stroke-linecap="round"/>`,
 2:()=>st(30,21,30,CG)+st(30,59,30,CB),
 3:()=>st(30,21,30,CG)+st(17,59,30,CB)+st(43,59,30,CB),
 4:()=>st(17,21,30,CG)+st(43,21,30,CB)+st(17,59,30,CB)+st(43,59,30,CG),
 5:()=>st(13,21,30,CG)+st(47,21,30,CB)+st(30,40,30,CR)+st(13,59,30,CB)+st(47,59,30,CG),
 6:()=>[12,30,48].map(x=>st(x,21,30,CG)+st(x,59,30,CB)).join(''),
 7:()=>st(30,12,20,CR)+[12,30,48].map(x=>st(x,40,20,CG)+st(x,67,20,CB)).join(''),
 8:()=>st(12,21,30,CG,14)+st(24,21,30,CG,-14)+st(36,21,30,CB,14)+st(48,21,30,CB,-14)+st(12,59,30,CB,-14)+st(24,59,30,CB,14)+st(36,59,30,CG,-14)+st(48,59,30,CG,14),
 9:()=>[13,40,67].map(y=>st(12,y,22,CG)+st(30,y,22,CR)+st(48,y,22,CB)).join('')
};
const FACE={};
function faceSvg(s,n){const k=s+''+n;if(!FACE[k])FACE[k]='<svg viewBox="0 0 60 80" aria-hidden="true">'+(s===1?PIN:SOU)[n]()+'</svg>';return FACE[k];}
function tileEl(t,cls=''){
  const d=document.createElement('div');
  if(isHonor(t)){
    const k=t-27; let c='h'; if(k===4)c+=' w'; if(k===5)c+=' g'; if(k===6)c+=' r';
    d.className='tile '+c+' '+cls; d.innerHTML='<div class="face">'+(k===4?'':'<span class="n">'+HON[k]+'</span>')+'</div>';
  }else{
    const s=suitOf(t), n=numOf(t);
    d.className='tile '+['m','p','s'][s]+' '+cls;
    d.innerHTML=s===0?'<div class="face"><span class="n">'+KAN[n-1]+'</span><span class="s">萬</span></div>':'<div class="face">'+faceSvg(s,n)+'</div>';
  }
  d.title=tileName(t); d.dataset.t=t; return d;
}
function toList(c){const a=[];for(let i=0;i<34;i++)for(let k=0;k<c[i];k++)a.push(i);return a;}

/* ===== 和了判定・分解 ===== */
function findMelds(c,i,ms){
  while(i<34&&c[i]===0)i++;
  if(i>=34)return true;
  if(c[i]>=3){c[i]-=3;ms.push([i,i,i]);if(findMelds(c,i,ms)){c[i]+=3;return true;}ms.pop();c[i]+=3;}
  if(i<27&&i%9<=6&&c[i+1]&&c[i+2]){c[i]--;c[i+1]--;c[i+2]--;ms.push([i,i+1,i+2]);
    const ok=findMelds(c,i,ms);c[i]++;c[i+1]++;c[i+2]++;if(ok)return true;ms.pop();}
  return false;
}
const YAO=[0,8,9,17,18,26,27,28,29,30,31,32,33];
function decompose(c){ // 14枚
  for(let i=0;i<34;i++)if(c[i]>=2){c[i]-=2;const ms=[];const ok=findMelds(c,0,ms);c[i]+=2;
    if(ok)return {groups:[[i,i],...ms]};}
  let p=0;for(let i=0;i<34;i++)if(c[i]===2)p++;
  if(p===7){const g=[];for(let i=0;i<34;i++)if(c[i]===2)g.push([i,i]);return {groups:g,chiitoi:true};}
  let k=0,pr=0;for(const y of YAO){if(c[y])k++;if(c[y]>=2)pr++;}
  if(k===13&&pr===1)return {groups:[toList(c)],kokushi:true};
  return null;
}
function waitsOf(c13){
  const w=[];
  for(let t=0;t<34;t++){ if(c13[t]>=4)continue; c13[t]++; if(decompose(c13))w.push(t); c13[t]--; }
  return w;
}

/* ===== 向聴数 ===== */
function shNormal(c){
  let best=8;
  function dfs(i,m,t,p){
    while(i<34&&c[i]===0)i++;
    if(i>=34){const tt=Math.min(t,4-m);const s=8-2*m-tt-p;if(s<best)best=s;return;}
    if(c[i]>=3){c[i]-=3;dfs(i,m+1,t,p);c[i]+=3;}
    if(i<27&&i%9<=6&&c[i+1]&&c[i+2]){c[i]--;c[i+1]--;c[i+2]--;dfs(i,m+1,t,p);c[i]++;c[i+1]++;c[i+2]++;}
    if(c[i]>=2){c[i]-=2;if(!p)dfs(i,m,t,1);if(m+t<4)dfs(i,m,t+1,p);c[i]+=2;}
    if(m+t<4){
      if(i<27&&i%9<=7&&c[i+1]){c[i]--;c[i+1]--;dfs(i,m,t+1,p);c[i]++;c[i+1]++;}
      if(i<27&&i%9<=6&&c[i+2]){c[i]--;c[i+2]--;dfs(i,m,t+1,p);c[i]++;c[i+2]++;}
    }
    const v=c[i];c[i]=0;dfs(i+1,m,t,p);c[i]=v; // 残りは孤立牌
  }
  dfs(0,0,0,0);return best;
}
function shChiitoi(c){let p=0,k=0;for(let i=0;i<34;i++){if(c[i])k++;if(c[i]>=2)p++;}return 6-p+Math.max(0,7-k);}
function shKokushi(c){let k=0,p=0;for(const y of YAO){if(c[y]){k++;if(c[y]>=2)p=1;}}return 13-k-p;}
function shanten(c){return Math.min(shNormal(c),shChiitoi(c),shKokushi(c));}
function ukeire(c13,seen){ // seen: 見えている枚数（自分の手以外）
  const s=shanten(c13);const list=[];let total=0;
  for(let t=0;t<34;t++){
    const rest=4-c13[t]-(seen?seen[t]:0); if(rest<=0)continue;
    c13[t]++; if(shanten(c13)<s){list.push(t);total+=rest;} c13[t]--;
  }
  return {s,list,total};
}
function evalDiscards(c14,seen){
  const res=[];
  for(let t=0;t<34;t++){ if(!c14[t])continue; c14[t]--; const u=ukeire(c14,seen); c14[t]++; res.push({t,...u}); }
  res.sort((a,b)=>a.s-b.s||b.total-a.total||b.list.length-a.list.length);
  return res;
}

/* ===== 手牌の生成 ===== */
function genComplete(suits,honorP){
  for(let tries=0;tries<300;tries++){
    const c=zeros(); const num=()=>pick(suits)*9+r(9);
    const p=(honorP>0&&Math.random()<honorP)?27+r(7):num(); c[p]+=2;
    let ok=true;
    for(let k=0;k<4&&ok;k++){
      let placed=false;
      for(let a=0;a<30&&!placed;a++){
        const x=Math.random();
        if(honorP>0&&x<honorP){const t=27+r(7);if(c[t]<=1){c[t]+=3;placed=true;}}
        else if(x<0.78){const t=pick(suits)*9+r(7);if(c[t]<4&&c[t+1]<4&&c[t+2]<4){c[t]++;c[t+1]++;c[t+2]++;placed=true;}}
        else{const t=num();if(c[t]<=1){c[t]+=3;placed=true;}}
      }
      if(!placed)ok=false;
    }
    if(ok)return c;
  }
  return null;
}
function removeRandom(c){const l=toList(c);const t=pick(l);c[t]--;return t;}
function addRandom(c,honorP){
  for(let a=0;a<50;a++){const t=Math.random()<honorP?27+r(7):r(27);if(c[t]<4){c[t]++;return t;}}
}

/* ---------- 何切る ---------- */
function genNani(target){ // target: 打牌後の向聴数（0 か 1、押し引きでは 2 も）
  for(let a=0;a<800;a++){
    const c=genComplete([0,1,2],0.1); if(!c)continue;
    const k=target===2?4:(target===1?3:2);
    for(let i=0;i<k;i++)removeRandom(c);
    for(let i=0;i<k;i++)addRandom(c,0.15);
    const s=shanten(c);
    if(s<0)continue;
    if(target!=null?s!==target:(s>1))continue;
    return c;
  }
  return null;
}
function newNani(){
  let c,ev;
  for(let a=0;a<60;a++){
    c=genNani(Math.random()<0.45?0:1); if(!c)continue;
    ev=evalDiscards(c);
    const s0=ev[0].s;const same=ev.filter(e=>e.s===s0);
    const best=same.filter(e=>e.total===same[0].total);
    if(same.length<3||best.length>2)continue;
    if(same[best.length]&&same[best.length].total===best[0].total)continue;
    break;
  }
  Q={c,ev,sel:null,done:false};
  subBar([timerChip()],streakText('nani'));
  main.innerHTML='';
  const q=h('div','q','何を切る？ <small>受け入れ枚数がいちばん多くなる1枚</small>');const tm=h('span','timer');q.appendChild(tm);main.appendChild(q);
  const bar=h('div','bar');const bi=h('i');bar.appendChild(bi);main.appendChild(bar);
  const list=toList(c);
  const hd=handEl(list,{onClick:(t,i,e)=>{if(Q.done)return;
    if(Q.selEl===e){answerNani(t);return;}
    if(Q.selEl)Q.selEl.classList.remove('sel');Q.selEl=e;Q.sel=t;e.classList.add('sel');Q.b1.disabled=false;}});
  main.appendChild(hd);Q.hd=hd;
  main.appendChild(h('div','note','<div style="text-align:center">牌をタップで選ぶ → もう一度タップか「これを切る」で決定</div>'));
  const act=h('div','actions');const b1=h('button','btn gold','これを切る');b1.disabled=true;b1.onclick=()=>answerNani(Q.sel);
  const b2=h('button','btn ghost','次の問題');b2.onclick=newNani;act.append(b1,b2);main.appendChild(act);Q.b1=b1;
  const res=h('div','result');main.appendChild(res);Q.res=res;
  startTimer(25,bi,tm,()=>answerNani(null));
}

  const ev=Q.ev;const b=ev[0];const best=ev.filter(e=>e.s===b.s&&e.total===b.total);

/* ---------- 共通（牌の文字列・危険度・点数） ---------- */
const SEATS=['下家','対面','上家'];
function P(str){ // "123m456p11z" → 牌の配列（z: 1東2南3西4北5白6發7中）
  const out=[];let buf=[];
  for(const ch of str.replace(/\s/g,'')){
    if(/[0-9]/.test(ch))buf.push(+ch);
    else{const s='mpsz'.indexOf(ch);buf.forEach(n=>out.push(s===3?27+n-1:s*9+n-1));buf=[];}
  }
  return out;
}
function cnt(list){const c=zeros();list.forEach(t=>c[t]++);return c;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=r(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
const doraOf=ind=>isHonor(ind)?(ind<=30?(ind===30?27:ind+1):(ind===33?31:ind+1)):(numOf(ind)===9?ind-8:ind+1);
function pct(x,d=1){return (x*100).toFixed(d)+'%';}
/* リーチ者に対する危険度の目安
   基本の数値は riichi.wiki の放銃率の表（平均）。
   壁・ワンチャンス・宣言牌のスジ・序盤に切られた牌の外側は、解説動画の考え方で補正した目安。
   vis: 見えている枚数（全員の捨て牌・ドラ表示牌・自分の手牌をすべて含む） */
function dangerR(t,river,decl,vis){
  if(river.includes(t))return {p:0,label:'現物',cat:0};
  if(isHonor(t)){const v=vis[t]-1;
    if(v>=3)return {p:0.001,label:'字牌（4枚目）',cat:1};
    if(v===2)return {p:0.003,label:'字牌（3枚目）',cat:2};
    if(v===1)return {p:0.022,label:'字牌（2枚目）',cat:3};
    return {p:0.049,label:'字牌（生牌）',cat:4};}
  const s=suitOf(t),n=numOf(t),T=k=>s*9+k-1;
  const ok=k=>k>=1&&k<=9;
  const inR=k=>ok(k)&&river.includes(T(k));
  function side(d){ // d=-1: (n-2,n-1)の両面, d=+1: (n+1,n+2)の両面
    const sj=n+3*d;
    if(inR(sj)){const onlyDecl=river.indexOf(T(sj))===decl&&river.filter(x=>x===T(sj)).length===1;return {safe:1,why:onlyDecl?'decl':'suji'};}
    const a=vis[T(n+d)],b=vis[T(n+2*d)];
    if(a>=4||b>=4)return {safe:1,why:'kabe'};
    if(a===3||b===3)return {safe:0.5,why:'one'};
    return {safe:0,why:'none'};
  }
  const sides=[-1,1].filter(d=>ok(n+3*d)).map(side);
  const W={suji:'スジ',decl:'宣言牌のスジ',kabe:'壁',one:'ワンチャンス',none:'無スジ'};
  let p,label,cat;
  if(sides.length===1){
    const tb=(n===1||n===9)?[0.080,0.019]:(n===2||n===8)?[0.092,0.040]:[0.101,0.056];
    const x=sides[0];p=tb[0]+(tb[1]-tb[0])*x.safe;label=W[x.why]+'の'+n;
    if(x.why==='decl'){p=(n===3||n===7)?0.084:p*1.6;}
    cat=x.safe===1?5:x.safe?6:7;
  }else{
    const sf=sides.reduce((a,x)=>a+x.safe,0);
    p=0.139-(0.139-0.081)*Math.min(sf,1)-(0.081-0.024)*Math.max(0,sf-1);
    if(sides.some(x=>x.why==='decl'))p*=1.4;
    label=sf>=2?(sides.every(x=>x.why==='suji')?'両スジの'+n:'両側とも通る'+n+'（'+sides.map(x=>W[x.why]).join('・')+'）'):
      sf>=1?'片側だけ通る'+n+'（'+sides.map(x=>W[x.why]).join('・')+'）':sf>0?'ワンチャンスの'+n:'無スジの'+n;
    if(sf===1&&sides.some(x=>x.why==='suji')&&sides.some(x=>x.why==='none'))label='片スジの'+n;
    cat=sf>=2?5:sf>=1?6:7;
  }
  // 序盤（5巡目まで）に切られた牌の外側の1・2・8・9は通りやすい
  const outer=n<=2?[n+1,3]:n>=8?[n-1,7]:[];
  const early=outer.filter(k=>ok(k)&&k!==n&&river.slice(0,5).includes(T(k)));
  if(p>0.03&&early.length){p*=0.6;label+='（序盤に'+early[0]+'が切られた外側）';}
  return {p,label,cat};
}
function genRiver(pool,len){ // 山（pool）から河を作る。序盤は字牌・端牌が多め
  const river=[];
  for(let k=0;k<len;k++){let t=-1;
    for(let z=0;z<80;z++){const x=r(34);if(!pool[x])continue;
      const edge=isHonor(x)||numOf(x)===1||numOf(x)===9;const mid=!isHonor(x)&&numOf(x)>=3&&numOf(x)<=7;
      if(k<4&&!edge&&Math.random()<0.7)continue;
      if(k>=4&&k<8&&mid&&Math.random()<0.35)continue;
      t=x;break;}
    if(t>=0){pool[t]--;river.push(t);}}
  return river;
}

  x[0]+=100000-x.reduce((p,q)=>p+q,0);if(x.every(v=>v>=2000&&v<=58000))return x;}return [25000,25000,25000,25000];}

function newOshi(){
  let G=null;
  for(let a=0;a<400&&!G;a++){

const RON_C=[[1000,'1翻30符'],[1300,'1翻40符'],[1600,'1翻50符・2翻25符'],[2000,'2翻30符'],[2600,'2翻40符'],[3200,'2翻50符'],[3900,'3翻30符'],[5200,'3翻40符'],[6400,'3翻50符'],[7700,'4翻30符'],[8000,'満貫'],[12000,'跳満'],[16000,'倍満'],[24000,'三倍満'],[32000,'役満']];
const TSUMO_C=[[300,500,'1翻30符'],[400,700,'1翻40符・2翻20符'],[400,800,'2翻25符'],[500,1000,'2翻30符'],[700,1300,'2翻40符・3翻20符'],[800,1600,'2翻50符'],[1000,2000,'3翻30符'],[1300,2600,'3翻40符・4翻20符'],[1600,3200,'3翻50符'],[2000,3900,'4翻30符'],[2000,4000,'満貫'],[3000,6000,'跳満'],[4000,8000,'倍満'],[6000,12000,'三倍満'],[8000,16000,'役満']];
function orasResult(sc,dealer,type,from,honba,kyo,idx){ // 自分(0)が和了したあとの点数
  const s=sc.slice();
  if(type==='tsumo'){const [ko,oya]=TSUMO_C[idx];
    for(let i=1;i<4;i++){const pay=(i===dealer?oya:ko)+100*honba;s[i]-=pay;s[0]+=pay;}}
  else{const v=RON_C[idx][0]+300*honba;s[from]-=v;s[0]+=v;}
  s[0]+=1000*kyo;return s;
}
function newOras(){
  let G=null;
  for(let a=0;a<500&&!G;a++){
    const kyo=Math.random()<0.5?0:1+r(2),honba=Math.random()<0.5?0:1+r(2);
    const sc=genScores();sc[0]-=1000*kyo;if(sc[0]<1000)continue;
    const dealer=1+r(3);
    const above=[1,2,3].filter(i=>sc[i]>sc[0]);if(!above.length)continue;
    const target=pick(above);if(sc[target]-sc[0]>12000)continue;
    const tv=Math.random();const type=tv<0.4?'direct':tv<0.75?'tsumo':'other';
    const from=type==='direct'?target:type==='other'?pick([1,2,3].filter(i=>i!==target)):null;
    const table=type==='tsumo'?TSUMO_C:RON_C;
    let ans=-1,tie=false;
    for(let k=0;k<table.length;k++){const s=orasResult(sc,dealer,type==='tsumo'?'tsumo':'ron',from,honba,kyo,k);
      if(s[0]===s[target])tie=true;
      if(s[0]>s[target]){ans=k;break;}}
    if(ans<0||tie)continue;
    if(ans===0&&Math.random()<0.7)continue;
    if(table[ans][table[ans].length-1].match(/倍満|三倍満|役満/)&&Math.random()<0.85)continue;
    G={sc,dealer,target,type,from,honba,kyo,ans,table,done:false};
  }
  if(!G){toast('問題を作れませんでした。もう一度押してください');return;}
  Q=G;
  subBar([],streakText('oras'));
  main.innerHTML='';
  const tn=NAMES[Q.target];
  const how=Q.type==='direct'?tn+'から<b>直撃（ロン）</b>':Q.type==='tsumo'?'<b>ツモ</b>':NAMES[Q.from]+'から<b>ロン</b>';
  main.appendChild(h('div','q','オーラス。'+how+'で'+tn+'を抜くのに必要な、いちばん安い打点は？'));
  main.appendChild(scoresEl(Q.sc,Q.dealer,[Q.target]));
  main.appendChild(h('div','sit','あなたは子。本場：<b>'+Q.honba+'本場</b>　供託（リーチ棒）：<b>'+Q.kyo+'本</b>　同点は不可（必ず上回る）'));
  // 選択肢：正解と近い3つ
  const idxs=new Set([Q.ans]);const near=[Q.ans-1,Q.ans+1,Q.ans+2,Q.ans-2,Q.ans+3].filter(k=>k>=0&&k<Q.table.length);
  for(const k of near){if(idxs.size>=4)break;idxs.add(k);}
  const opts=[...idxs].sort((x,y)=>x-y);
  const lab=k=>Q.type==='tsumo'?Q.table[k][0].toLocaleString()+'-'+Q.table[k][1].toLocaleString()+'（'+Q.table[k][2]+'）':Q.table[k][0].toLocaleString()+'（'+Q.table[k][1]+'）';
  const ch=h('div','choices');Q.btns=[];
  opts.forEach(k=>{const b=h('button','btn',lab(k)+(Q.type==='tsumo'?' <span class="note">子-親</span>':''));b.onclick=()=>answerOras(k);ch.appendChild(b);Q.btns.push([b,k]);});
  main.appendChild(ch);
  const act=h('div','actions');const b2=h('button','btn ghost small','次の問題');b2.onclick=newOras;act.append(b2);main.appendChild(act);
  const res=h('div','result');main.appendChild(res);Q.res=res;
}
function answerOras(k){
  if(Q.done)return;Q.done=true;const ok=k===Q.ans;
  Q.btns.forEach(([b,x])=>{b.disabled=true;if(x===Q.ans)b.classList.add('right');else if(x===k)b.classList.add('wrong');});
  record('oras',ok);
  const R=Q.res;R.innerHTML='';
  R.appendChild(h('div','verdict '+(ok?'ok':'ng'),ok?'正解！':'不正解'));
  const T=Q.target,tn=NAMES[T];const gap=Q.sc[T]-Q.sc[0];
  const typ=Q.type==='tsumo'?'tsumo':'ron';
  const show=x=>{const s=orasResult(Q.sc,Q.dealer,typ,Q.from,Q.honba,Q.kyo,x);return '自分 '+s[0].toLocaleString()+' 対 '+tn+' '+s[T].toLocaleString();};
  let why='点差は <b>'+gap.toLocaleString()+'点</b>。';
  if(Q.type==='direct')why+='直撃は相手から点を取るので、差は「打点の2倍」縮みます。';
  else if(Q.type==='tsumo')why+='ツモは全員から取るので、'+tn+'の支払い分（'+(T===Q.dealer?'親なので多め':'子の支払い')+'）だけ差がさらに縮みます。';
  else why+='他の人からのロンでは、'+tn+'の点は減りません。打点そのもので差を越える必要があります。';
  if(Q.honba)why+=' 本場は'+(typ==='ron'?'1本につき300点':'1本につき各100点')+'加わります。';
  if(Q.kyo)why+=' 供託のリーチ棒'+Q.kyo+'本（'+(Q.kyo*1000).toLocaleString()+'点）も和了った人がもらいます。';
  R.appendChild(h('div',null,why));
  R.appendChild(h('div',null,'正解の打点で和了すると：<b>'+show(Q.ans)+'</b>'+(Q.ans>0?'<br>1つ下の打点だと：'+show(Q.ans-1):'')));
  R.appendChild(h('div','note','直撃なら点差の半分を少し超えればよい、が基本の目安です。'));
  renderStreak('oras');
}

 ['嵌張落とし。テンパイが速い可能性が高いのは？',['3→1の順に切った','1→3の順に切った','同じ','字牌が先'],'3→1は、ほかが両面で固まっていて危ない3から先に切った形が多い。1→3は、4を引いて両面に変えたい＝まだ愚形が残っていることが多い（雀太郎ちゃんねるの動画）。'],
 ['4→6の順に嵌張落としした人のリーチ。本命の待ちは？',['5-8','2-5','3-6','1-4'],'2-5待ちになる形を持っていたら、受け入れを広く残すために6から先に切るのが自然。4→6の順なら2-5は薄く、5-8が本命（8は愚形でも当たりやすい）（雀太郎ちゃんねるの動画）。'],
 ['役牌（白）の対子落としが入った。意味することは？',['打点も形もそろった1シャンテン以上の可能性が高い','役がなくて困っている','七対子に決めた','降りている'],'鳴くだけで役になる白を落とすのは、タンヤオ・平和などで手がまとまっているサイン（雀太郎ちゃんねるの動画）。'],
 ['両面・両面の1シャンテンからテンパイまで、平均どれくらいかかるとされる？',['約8巡','約3巡','約5巡','約12巡'],'1シャンテンからテンパイは思ったより遅い。だから愚形を消して両面テンパイになる鳴きは序盤でも取る、という考え方につながります（発男道場）。'],
 ['オーラス、2着と5,000点差（自分は子）。直撃で逆転する最低の打点は？',['2,600点','2,000点','3,900点','5,200点'],'直撃は差が打点の2倍縮むので、2,600点で5,200点縮んで逆転。2,000点では4,000点しか縮みません。'],
 ['多井隆晴プロが「これがないと1半荘あたり約1,000点損」と言う技術は？',['終盤に鳴いて形式テンパイを取るなどの粘り','点数計算','何切るの丸暗記','早いリーチ'],'和了るか降りるかの2択だけでなく、粘ってテンパイを取る技術の差が大きい（たかちゃんねるの動画）。'],
 ['天鳳位ヨーテルさんの考え方に近いのは？',['細かい枚数比較より、大まかな方針（ホンイツなら他の色は切る、配牌が悪ければ守り）','いつも受け入れ最大の打牌を厳密に選ぶ','どんな手でも全部押す','鳴きは一切しない'],'上級者は細かい比較で悩まず、方針を大づかみに決めてミスを減らしている、という話（ヨーテルさんの動画）。'],
 ['2巡目に8萬を切っている人のリーチ。9萬の安全度は？',['外側のスジ（スジの3・7）と同じか、それより安全なことが多い','無スジの4・5・6並みに危険','現物と同じ','字牌の生牌より危険'],'788から8を切って両面に固定するのは少ないので、9萬は外側のスジくらい安全なことが多い（平澤元気プロの守備講座）。'],
 ['勝負手のとき、生牌の字牌はいつごろまでに切っておくのがよいとされる？',['5〜6巡目','1〜2巡目','10巡目','切らずに最後まで持つ'],'テンパイの平均は8〜9巡目ごろ。後になるほど危なくなるので、勝負手なら早めに切っておきます。'],
 ['「3悪」（鳴かない方がよい仕掛け）に入らないのは？',['役牌の対子がある','面子が0','愚形が残る','打点が決まらない'],'3悪は「面子0・愚形残り・打点不確定」。役牌の対子があれば打点は決まっています（ゆうせーさんの動画）。'],
 ['1シャンテンの押し引きで判断に使う3つの要素は？',['打点・形・巡目','ドラ・赤・裏','親・子・点差','字牌・端牌・中張牌'],'3つのうち2つ以上が悪ければ降り、が目安です（発男道場の1シャンテンの押し引き）。']
];
let KBAG=[];
function newChishiki(){
  if(!KBAG.length)KBAG=shuffle([...Array(KQ.length).keys()]);
  const [q,choices,exp]=KQ[KBAG.pop()];
  const order=shuffle(choices.map((c,i)=>i));
  Q={q,choices,exp,order,done:false};
  subBar([],streakText('chishiki'));
  main.innerHTML='';
  main.appendChild(h('div','q',q));
  const ch=h('div','choices');Q.btns=[];
  order.forEach(i=>{const b=h('button','btn',choices[i]);b.onclick=()=>answerChishiki(i);ch.appendChild(b);Q.btns.push([b,i]);});
  main.appendChild(ch);
  const act=h('div','actions');const b2=h('button','btn ghost small','次の問題');b2.onclick=newChishiki;act.append(b2);main.appendChild(act);
  const res=h('div','result');main.appendChild(res);Q.res=res;
}
function answerChishiki(i){
  if(Q.done)return;Q.done=true;const ok=i===0;
  Q.btns.forEach(([b,x])=>{b.disabled=true;if(x===0)b.classList.add('right');else if(x===i)b.classList.add('wrong');});
  record('chishiki',ok);
  const R=Q.res;R.innerHTML='';
  R.appendChild(h('div','verdict '+(ok?'ok':'ng'),ok?'正解！':'不正解'));
  R.appendChild(h('div',null,Q.exp));
  renderStreak('chishiki');
}

/* ---------- 記録 ---------- */
function renderRec(){
  subBar([],'');main.innerHTML='';const R=rankInfo();
  const top=h('div','card');
  const curMin=RANKS[R.i][0],nxt=RANKS[R.i+1];const w=nxt?((R.n-curMin)/(nxt[0]-curMin)*100):100;
  top.innerHTML='<h3>段位</h3><div class="big">'+R.name+'</div><div class="prog"><i style="width:'+w+'%"></i></div>'+
    '<div class="note">正解の合計 '+R.n+'問。'+(nxt?'あと'+R.next+'問で'+nxt[1]+'。':'雀聖に到達しました。')+'雀聖は正解400問。</div>';
  main.appendChild(top);
  const st=h('div','stat');
  MODES.forEach(([k,n])=>{const m=S[k];
    const c=h('div','card');c.style.padding='6px 10px';c.innerHTML='<h3>'+n+'</h3><div class="kv"><span>正解</span><span>'+m.ok+' / '+m.n+(m.n?'（'+Math.round(m.ok/m.n*100)+'%）':'')+'</span><span>最高</span><span>'+m.best+'連続</span></div>';
    st.appendChild(c);});
  st.style.overflow='auto';st.style.minHeight='0';
  const c4=h('div','card');c4.innerHTML='<h3>保存</h3><div class="note" style="margin-bottom:6px">記録はこの端末のブラウザに保存されます。答えるたびに自動で保存し、上の「セーブ」でも保存できます。</div>';
  const rb=h('button','btn small ghost','記録を消す');rb.onclick=()=>{if(rb.dataset.c){S=blank();save(true);renderRank();renderRec();}else{rb.dataset.c=1;rb.textContent='もう一度押すと消えます';}};
  c4.appendChild(rb);st.appendChild(c4);main.appendChild(st);
}

renderRank();setMode('wait');
</script>
